name: Publish private PropLine JSON

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check required API key
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: test -n "$PROPLINE_API_KEY" || { echo 'Add repository secret PROPLINE_API_KEY'; exit 1; }

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'propline-data/Player Odds' --dest 'data/Player Odds'
          python action/scripts/r2_data.py download --prefix 'propline-data/team-rosters' --dest 'data/team-rosters'
          python action/scripts/r2_data.py download-key --key 'propline-data/manifest.json' --dest 'data/manifest.json'

      - name: Fetch and build complete JSON generation
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python3 action/scripts/publish_propline.py

      - name: Publish PropLine data to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'Player Odds'='propline-data/Player Odds'
          python ../action/scripts/r2_data.py sync --root . --map 'Player Lists'='propline-data/Player Lists'
          python ../action/scripts/r2_data.py sync --root . --map 'manifest.json'='propline-data/manifest.json'
          python ../action/scripts/r2_data.py sync --root . --map 'team-rosters'='propline-data/team-rosters'
          python ../action/scripts/r2_data.py delete --prefix propline-data/versions
          python ../action/scripts/r2_data.py delete --prefix propline-data/player-lists
