name: One-time publisher verification dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-verification-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch each migrated publisher once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          publishers=(
            cfb-player-game-logs-publish.yml
            cfb-team-stats-publish.yml
            cfbdepth-injuries.yml
            line-movement-graphs.yml
            mlb-prop-center-publish.yml
            nba-injury-report-publish.yml
            nba-matchups-publish.yml
            nba-prop-center-publish.yml
            nba-stats-publish.yml
            ncaab-prop-center-publish.yml
            nfl-injury-report-publish.yml
            nfl-matchups-publish.yml
            nfl-projection-backtest.yml
            nfl-team-stats-publish.yml
            nhl-team-stats-publish.yml
            pikkit-consensus.yml
            propline-game-odds-publish.yml
            propline-publish.yml
            sharp-odds-ncaaf-publish.yml
            wnba-prop-center-publish.yml
          )
          failed=0
          for workflow in "${publishers[@]}"; do
            echo "Dispatching $workflow"
            if gh workflow run "$workflow" --ref main; then
              echo "Dispatched $workflow"
            else
              echo "::error::Dispatch failed for $workflow"
              failed=$((failed + 1))
            fi
            sleep 2
          done
          echo "Dispatch attempts: ${#publishers[@]}; failures: $failed"
          if [[ "$failed" -gt 0 ]]; then exit 1; fi
