name: Sync PropLine webhook cache to R2

on:
  push:
    branches:
      - Propline-Webhook-Cache
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: propline-webhook-cache-r2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the publisher helper
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check out the latest webhook-cache snapshot
        uses: actions/checkout@v6
        with:
          ref: Propline-Webhook-Cache
          persist-credentials: false
          fetch-depth: 1
          path: data

      - name: Publish the latest snapshot to Cloudflare R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'data=Propline-Webhook-Cache/data'
