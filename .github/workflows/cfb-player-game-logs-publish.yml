name: Publish CFB player game-log cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfb-player-game-logs-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'cfb-player-game-logs-data/cfb-player-game-logs' --dest 'data/cfb-player-game-logs'
      - name: Prepare CFB receiving target data
        env:
          CFB_PLAYER_LOGS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python action/scripts/export_cfb_player_targets.py

      - name: Fetch bulk CFB data and build player logs
        env:
          CFB_PLAYER_LOGS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: deno run --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_cfb_player_game_logs_github.ts

      - name: Publish normalized player logs to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'cfb-player-game-logs'='cfb-player-game-logs-data/cfb-player-game-logs'
