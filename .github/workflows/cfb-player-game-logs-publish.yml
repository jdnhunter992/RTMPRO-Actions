name: Publish CFB player game-log cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-player-game-logs-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore cfb-player-game-logs-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py restore --branch 'cfb-player-game-logs-data' --path 'cfb-player-game-logs'
      - name: Prepare CFB receiving target data
        env:
          CFB_PLAYER_LOGS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: |
          python -m pip install --disable-pip-version-check pyarrow
          python action/scripts/export_cfb_player_targets.py

      - name: Fetch bulk CFB data and build player logs
        env:
          CFB_PLAYER_LOGS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: deno run --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_cfb_player_game_logs_github.ts

      - name: Publish cfb-player-game-logs-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py publish --branch 'cfb-player-game-logs-data' --path 'cfb-player-game-logs'
