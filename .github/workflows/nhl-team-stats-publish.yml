name: NHL Game Detail Stats

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-game-detail-stats-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Restore nhl-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py restore --branch 'nhl-team-stats-data' --path 'nhl-team-stats'
      - name: Fetch NHL reports and play-by-play; build all filters and league ranks
        env:
          NHL_TEAM_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: deno run --no-check --allow-net --allow-read --allow-write --allow-env=NHL_TEAM_STATS_OUTPUT_DIR,NHL_TEAM_STATS_SEASON action/action/scripts/publish_nhl_team_stats.ts

      - name: Publish nhl-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py publish --branch 'nhl-team-stats-data' --path 'nhl-team-stats'
