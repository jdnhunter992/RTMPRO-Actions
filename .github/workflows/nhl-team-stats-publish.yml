name: NHL Game Detail Stats

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-game-detail-stats-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'nhl-team-stats-data/nhl-team-stats' --dest 'data/nhl-team-stats'
      - name: Fetch NHL reports and play-by-play; build all filters and league ranks
        env:
          NHL_TEAM_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: deno run --no-check --allow-net --allow-read --allow-write --allow-env=NHL_TEAM_STATS_OUTPUT_DIR,NHL_TEAM_STATS_SEASON action/action/scripts/publish_nhl_team_stats.ts

      - name: Publish NHL game-detail JSON to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'nhl-team-stats'='nhl-team-stats-data/nhl-team-stats'
