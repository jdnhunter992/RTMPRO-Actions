name: NBA stats

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-team-stats-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare output directory
        run: mkdir -p data
      - name: Fetch completed NBA box scores, calculate splits, and publish game JSON
        env:
          NBA_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: python action/action/scripts/publish_nba_stats.py

      - name: Publish NBA stats JSON to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'nba-team-stats'='nba-team-stats-data/nba-team-stats'
