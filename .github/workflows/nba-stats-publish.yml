name: NBA stats

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-team-stats-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore nba-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nba-team-stats-data' --path 'nba-team-stats'
      - name: Prepare output directory
        run: mkdir -p data
      - name: Fetch completed NBA box scores, calculate splits, and publish game JSON
        env:
          NBA_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: python action/action/scripts/publish_nba_stats.py

      - name: Publish nba-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nba-team-stats-data' --path 'nba-team-stats'
