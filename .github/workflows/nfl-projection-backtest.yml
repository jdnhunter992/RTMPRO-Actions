name: NFL Projection Backtest

on:
  schedule:
    - cron: '15 19 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: NFL season to grade
        required: false
        type: string
      week:
        description: Week to grade
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-projection-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned parquet reader
        run: npm install --prefix action --no-save --no-package-lock hyparquet@1.24.0

      - name: Prepare output directory
        run: mkdir -p data
      - name: Generate backtest results
        env:
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
          NFL_BACKTEST_OUTPUT_PATH: ${{ github.workspace }}/data/nfl-projection-backtest.json
        run: node --max-old-space-size=4096 action/scripts/nfl-projection-backtest.mjs

      - name: Publish backtest JSON to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'nfl-projection-backtest.json'='nfl-projection-backtest-data/nfl-projection-backtest.json'
