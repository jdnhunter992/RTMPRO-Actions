name: NFL Projection Backtest

on:
  schedule:
    - cron: '15 19 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: NFL season to grade
        required: false
        type: string
      week:
        description: Week to grade
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nfl-projection-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned parquet reader
        run: npm install --prefix action --no-save --no-package-lock hyparquet@1.24.0

      - name: Restore nfl-projection-backtest-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nfl-projection-backtest-data' --path 'nfl-projection-backtest.json'
      - name: Prepare output directory
        run: mkdir -p data
      - name: Generate backtest results
        env:
          NFL_SEASON: ${{ inputs.season }}
          NFL_WEEK: ${{ inputs.week }}
          NFL_BACKTEST_OUTPUT_PATH: ${{ github.workspace }}/data/nfl-projection-backtest.json
        run: node --max-old-space-size=4096 action/scripts/nfl-projection-backtest.mjs

      - name: Publish nfl-projection-backtest-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nfl-projection-backtest-data' --path 'nfl-projection-backtest.json'
