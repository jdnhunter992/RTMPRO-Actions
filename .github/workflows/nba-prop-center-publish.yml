name: NBA Prop Center Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore nba-prop-center-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nba-prop-center-data' --path 'nba-prop-center'
      - name: Fetch NBA box scores and build prop-center JSON
        env:
          NBA_PROP_CENTER_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/action/scripts/publish_nba_prop_center.py

      - name: Publish nba-prop-center-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nba-prop-center-data' --path 'nba-prop-center'
