name: Line Movement Graphs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'propline-data/line-movement-graphs/v1' --dest 'data/line-movement-graphs/v1'

      - name: Scrape and publish ScoresAndOdds line movement graphs
        env:
          LINE_MOVEMENT_OUTPUT_DIR: ${{ github.workspace }}/data/line-movement-graphs/v1
        run: deno run --no-check --allow-net --allow-read --allow-write --allow-env=LINE_MOVEMENT_OUTPUT_DIR action/action/scripts/publish_line_movement_graphs.ts

      - name: Publish line movement graphs to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'line-movement-graphs/v1'='propline-data/line-movement-graphs/v1'
