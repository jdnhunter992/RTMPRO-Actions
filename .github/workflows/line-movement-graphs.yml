name: Line Movement Graphs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore line-movement-graphs-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'line-movement-graphs-data' --path 'line-movement-graphs/v1'
      - name: Scrape and publish ScoresAndOdds line movement graphs
        env:
          LINE_MOVEMENT_OUTPUT_DIR: ${{ github.workspace }}/data/line-movement-graphs/v1
        run: deno run --no-check --allow-net --allow-read --allow-write --allow-env=LINE_MOVEMENT_OUTPUT_DIR action/action/scripts/publish_line_movement_graphs.ts

      - name: Publish line-movement-graphs-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'line-movement-graphs-data' --path 'line-movement-graphs/v1'
