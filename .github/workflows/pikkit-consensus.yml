name: Pikkit Consensus HTTP Publisher
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: 'League codes, comma separated, or all (NCAAB is always included and queried from Pikkit as NCAAM)'
        default: 'all'
        required: false
      days:
        description: 'Maximum date window: MLB/NBA/NCAAB/WNBA/NHL use 1 day; NFL/NCAAFB use up to 7 days'
        default: '7'
        required: false
permissions:
  contents: read
concurrency:
  group: pikkit-consensus-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LEAGUES: ${{ inputs.leagues || 'all' }}
      DAYS_AHEAD: ${{ inputs.days || '7' }}
      EVENT_DELAY_MIN_SECONDS: '5'
      EVENT_DELAY_MAX_SECONDS: '10'
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect consensus
        env:
          PIKKIT_AUTH_TOKEN: ${{ secrets.PIKKIT_AUTH_TOKEN }}
        run: python3 action/pikkit-consensus/scripts/collect.py --out /tmp/pikkit-consensus-data
      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'Pikkit-Consensus/data' --dest 'data/data'
      - name: Stage verified consensus indexes and event details
        working-directory: data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path

          source = Path('/tmp/pikkit-consensus-data')
          destination = Path('data')
          indexes = sorted(source.glob('*.json'))
          if not indexes:
              raise SystemExit('Collector produced no sport indexes')
          for index in indexes:
              doc = json.loads(index.read_text())
              league = doc.get('league')
              if not isinstance(league, str) or not re.fullmatch(r'[A-Za-z0-9_-]+', league):
                  raise SystemExit(f'Invalid league in {index}')
              slug = league.lower()
              if index.name != f'{slug}.json' or doc.get('complete') is not True or not isinstance(doc.get('events'), list):
                  raise SystemExit(f'Invalid sport index: {index}')
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(index, destination / index.name)
              incoming = set()
              for event in doc['events']:
                  event_id = event.get('event_id')
                  if not isinstance(event_id, str) or not re.fullmatch(r'[A-Za-z0-9_-]+', event_id):
                      raise SystemExit(f'Invalid event ID in {index}')
                  filename = f'{event_id}.json'
                  rel_path = f'events/{slug}/{filename}'
                  if event.get('detail_path') != rel_path or filename in incoming:
                      raise SystemExit(f'Invalid or duplicate detail_path for {event_id}')
                  detail_source = source / rel_path
                  detail = json.loads(detail_source.read_text())
                  if detail.get('complete') is not True or detail.get('event_id') != event_id:
                      raise SystemExit(f'Invalid event detail file: {detail_source}')
                  incoming.add(filename)
                  target_events = destination / 'events' / slug
                  target_events.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(detail_source, target_events / filename)
              target_events = destination / 'events' / slug
              if target_events.exists():
                  for old in target_events.glob('*.json'):
                      if old.name not in incoming:
                          old.unlink()
          PY
      - name: Publish Pikkit consensus data to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'data'='Pikkit-Consensus/data'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikkit-consensus-json
          path: |
            /tmp/pikkit-consensus-data/*.json
            /tmp/pikkit-consensus-data/events/**/*.json
          if-no-files-found: warn
