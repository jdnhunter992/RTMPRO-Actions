name: NFL Matchups Recommendations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-matchups-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore nfl-matchups-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nfl-matchups-data' --path 'nfl-matchups'
      - name: Build this week’s NFL matchup recommendations
        env:
          NFL_MATCHUPS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/action/scripts/publish_nfl_matchups.py

      - name: Publish nfl-matchups-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nfl-matchups-data' --path 'nfl-matchups'
