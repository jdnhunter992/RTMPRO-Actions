name: NFL Matchups Recommendations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-matchups-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'nfl-matchups-data/nfl-matchups' --dest 'data/nfl-matchups'
      - name: Build this week’s NFL matchup recommendations
        env:
          NFL_MATCHUPS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/action/scripts/publish_nfl_matchups.py

      - name: Publish NFL matchup data to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'nfl-matchups'='nfl-matchups-data/nfl-matchups'
