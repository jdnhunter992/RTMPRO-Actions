name: Seed Cloudflare R2 from published snapshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seed-r2-from-legacy-branches.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-r2-from-legacy-branches
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the R2 transfer helper
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check out the latest published snapshots
        uses: actions/checkout@v6
        with:
          ref: Pikkit-Consensus
          persist-credentials: false
          fetch-depth: 1
          path: snapshots/pikkit
      - uses: actions/checkout@v6
        with:
          ref: Propline-Webhook-Cache
          persist-credentials: false
          fetch-depth: 1
          path: snapshots/propline-webhook-cache
      - uses: actions/checkout@v6
        with:
          ref: cfb-player-game-logs-data
          persist-credentials: false
          fetch-depth: 1
          path: snapshots/cfb-player-game-logs
      - uses: actions/checkout@v6
        with:
          ref: cfb-team-stats-data
          persist-credentials: false
          fetch-depth: 1
          path: snapshots/cfb-team-stats
      - uses: actions/checkout@v6
        with:
          ref: nba-injury-report-data
          persist-credentials: false
          fetch-depth: 1
          path: snapshots/nba-injuries

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Seed R2 with the current snapshots
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py sync --root . \
            --map snapshots/pikkit/data=Pikkit-Consensus/data \
            --map snapshots/propline-webhook-cache/data=Propline-Webhook-Cache/data \
            --map snapshots/cfb-player-game-logs/cfb-player-game-logs=cfb-player-game-logs-data/cfb-player-game-logs \
            --map snapshots/cfb-team-stats/cfb-team-stats=cfb-team-stats-data/cfb-team-stats \
            --map snapshots/nba-injuries/nba-injuries=nba-injury-report-data/nba-injuries
