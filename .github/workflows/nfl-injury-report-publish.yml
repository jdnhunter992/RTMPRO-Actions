name: NFL Injury Report Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-injury-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore nfl-injury-report-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nfl-injury-report-data' --path 'nfl-injuries'
      - name: Prepare output directory
        run: mkdir -p data
      - name: Fetch Yahoo injuries and calculate player and team impact
        env:
          NFL_INJURY_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/action/scripts/publish_nfl_injury_report.py

      - name: Publish nfl-injury-report-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nfl-injury-report-data' --path 'nfl-injuries'
