name: Refresh NFL team stats cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-team-stats-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python scripts/r2_data.py download --prefix 'nfl-team-stats-data/nfl-team-stats' --dest 'data/nfl-team-stats'
      - name: Refresh all NFL teams and timeframes
        env:
          NFL_TEAM_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          STATRANKINGS_COOKIE: ${{ secrets.STATRANKINGS_COOKIE }}
        run: deno run --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_nfl_team_stats_github.ts

      - name: Publish NFL stats cache to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../scripts/r2_data.py sync --root . --map 'nfl-team-stats'='nfl-team-stats-data/nfl-team-stats'
