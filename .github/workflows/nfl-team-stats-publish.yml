name: Refresh NFL team stats cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-team-stats-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore nfl-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py restore --branch 'nfl-team-stats-data' --path 'nfl-team-stats'
      - name: Refresh all NFL teams and timeframes
        env:
          NFL_TEAM_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          STATRANKINGS_COOKIE: ${{ secrets.STATRANKINGS_COOKIE }}
        run: deno run --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_nfl_team_stats_github.ts

      - name: Publish nfl-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py publish --branch 'nfl-team-stats-data' --path 'nfl-team-stats'
