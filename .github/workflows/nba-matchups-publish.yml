name: NBA Matchups Recommendations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-matchups-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore nba-matchups-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nba-matchups-data' --path 'nba-matchups'
      - name: Build today’s NBA matchup recommendations
        env:
          NBA_MATCHUPS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/scripts/publish_nba_matchups.py

      - name: Publish nba-matchups-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nba-matchups-data' --path 'nba-matchups'
