name: NBA Injury Report Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * 1-6,10-12 * *"

permissions:
  contents: write

concurrency:
  group: nba-injury-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install "pdfplumber>=0.11,<0.12"

      - name: Restore nba-injury-report-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'nba-injury-report-data' --path 'nba-injuries'
      - name: Prepare output directory
        run: mkdir -p data
      - name: Fetch the latest NBA PDF and enrich listed players
        env:
          NBA_INJURY_OUTPUT_DIR: ${{ github.workspace }}/data
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: python action/action/scripts/publish_nba_injury_report.py

      - name: Publish nba-injury-report-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'nba-injury-report-data' --path 'nba-injuries'
