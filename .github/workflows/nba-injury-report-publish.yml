name: NBA Injury Report Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * 1-6,10-12 * *"

permissions:
  contents: read

concurrency:
  group: nba-injury-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF parser
        run: python -m pip install "pdfplumber>=0.11,<0.12"

      - name: Prepare output directory
        run: mkdir -p data
      - name: Fetch the latest NBA PDF and enrich listed players
        env:
          NBA_INJURY_OUTPUT_DIR: ${{ github.workspace }}/data
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
        run: python action/action/scripts/publish_nba_injury_report.py

      - name: Publish NBA injury report JSON to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../action/scripts/r2_data.py sync --root . --map 'nba-injuries'='nba-injury-report-data/nba-injuries'
