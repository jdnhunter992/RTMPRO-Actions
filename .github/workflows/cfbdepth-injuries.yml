name: CFBDepth injury reports

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfbdepth-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore cfbdepth-injuries-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'cfbdepth-injuries-data' --path 'cfbdepth'
      - name: Fetch all team reports
        run: python action/scripts/cfbdepth_injuries.py --out data/cfbdepth --workers 2
      - name: Upload results including partial coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfbdepth-injuries
          path: |
            data/cfbdepth/injuries.json
            data/cfbdepth/injuries.csv
            data/cfbdepth/registry.json
          if-no-files-found: warn
      - name: Validate complete CFBDepth coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/cfbdepth/injuries.json").read_text(encoding="utf-8"))
          refreshed = int(data.get("refreshed_teams") or 0)
          total = int(data.get("registry_team_count") or 0)
          covered = len(data.get("teams") or [])
          errors = data.get("errors") or []
          print(f"CFBDepth coverage: refreshed={refreshed}, available={covered}/{total}, failed_requests={len(errors)}, complete={data.get('complete')}", flush=True)
          for item in errors:
              print(f"FAILED {item.get('team_slug')}: {item.get('error')} (cached={item.get('using_last_known_data')})", flush=True)
          # Allow a small bounded number of source failures when last-known
          # reports keep coverage complete. Missing teams remain tightly capped.
          max_unrefreshed = min(2, max(1, total // 50))
          missing = total - covered
          if total <= 0 or covered > total or refreshed <= 0:
              raise SystemExit("Invalid CFBDepth coverage totals: refusing to publish.")
          if missing > 1 or refreshed < total - max_unrefreshed:
              raise SystemExit(
                  f"CFBDepth refresh too incomplete to publish: missing={missing}, "
                  f"refreshed={refreshed}/{total} (allowed unrefreshed={max_unrefreshed}). "
                  "Review uploaded diagnostics."
              )
          if missing or errors:
              print(
                  f"WARNING: Publishing partial CFBDepth snapshot "
                  f"({covered}/{total} teams available, {refreshed} refreshed). "
                  "Missing teams must not be interpreted as injury-free.",
                  flush=True,
              )
          PY

      - name: Publish cfbdepth-injuries-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'cfbdepth-injuries-data' --path 'cfbdepth'
