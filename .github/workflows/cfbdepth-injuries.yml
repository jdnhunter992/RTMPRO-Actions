name: CFBDepth injury reports

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfbdepth-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python action/scripts/r2_data.py download --prefix 'cfbdepth-injuries-data/cfbdepth' --dest 'data/cfbdepth'
      - name: Fetch all team reports
        run: python action/scripts/cfbdepth_injuries.py --out data/cfbdepth --workers 2
      - name: Upload results including partial coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfbdepth-injuries
          path: |
            data/cfbdepth/injuries.json
            data/cfbdepth/injuries.csv
            data/cfbdepth/registry.json
          if-no-files-found: warn
      - name: Publish complete CFBDepth coverage to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python -c 'import json,sys; d=json.load(open("cfbdepth/injuries.json")); sys.exit(0 if d.get("complete") is True and int(d.get("refreshed_teams", 0)) > 0 else 1)' || { echo 'Skipping publish: no refreshed teams or league coverage is incomplete.'; exit 0; }
          python ../action/scripts/r2_data.py sync --root . --map 'cfbdepth'='cfbdepth-injuries-data/cfbdepth'
