name: CFBDepth injury reports

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfbdepth-injuries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore cfbdepth-injuries-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py restore --branch 'cfbdepth-injuries-data' --path 'cfbdepth'
      - name: Fetch all team reports
        run: python action/scripts/cfbdepth_injuries.py --out data/cfbdepth --workers 2
      - name: Upload results including partial coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfbdepth-injuries
          path: |
            data/cfbdepth/injuries.json
            data/cfbdepth/injuries.csv
            data/cfbdepth/registry.json
          if-no-files-found: warn
      - name: Publish cfbdepth-injuries-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python action/scripts/snapshot_git.py publish --branch 'cfbdepth-injuries-data' --path 'cfbdepth'
