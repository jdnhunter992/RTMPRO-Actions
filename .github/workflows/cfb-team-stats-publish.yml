name: Refresh CFB team stats cache

on:
  workflow_dispatch:
    inputs:
      refresh_previous:
        description: Rebuild the previous season's materialized stats
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cfb-team-stats-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore cfb-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py restore --branch 'cfb-team-stats-data' --path 'cfb-team-stats'
      - name: Fetch, calculate, and materialize all CFB timeframes
        env:
          CFB_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          CFB_REFRESH_PREVIOUS_SEASON: ${{ github.event.inputs.refresh_previous || 'false' }}
        run: deno run --node-modules-dir=auto --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_cfb_team_stats_github.ts

      - name: Publish cfb-team-stats-data Git snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_git.py publish --branch 'cfb-team-stats-data' --path 'cfb-team-stats'
