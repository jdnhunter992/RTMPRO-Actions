name: Refresh NCAAF SharpOdds cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharp-odds-ncaaf-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required SharpOdds secrets
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
        run: test -n "$SHARP_API_KEY" || { echo 'Add repository secret SHARP_API_KEY'; exit 1; }

      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore published data from Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python scripts/r2_data.py download --prefix 'sharpodds-data/sharp-odds/ncaaf' --dest 'data/sharp-odds/ncaaf'

      - name: Refresh and materialize NCAAF snapshots
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
          PINNACLE_GUEST_API_KEY: ${{ secrets.PINNACLE_GUEST_API_KEY }}
          NOVIG_CLIENT_ID: ${{ secrets.NOVIG_CLIENT_ID }}
          NOVIG_CLIENT_SECRET: ${{ secrets.NOVIG_CLIENT_SECRET }}
          REBET_API_KEY: ${{ secrets.REBET_API_KEY }}
          SHARP_ODDS_OUTPUT_DIR: ${{ github.workspace }}/data
          SHARP_ODDS_IMPORT_ONLY: 'true'
        run: deno run --node-modules-dir=auto --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_sharp_odds_ncaaf_github.ts

      - name: Publish NCAAF SharpOdds cache to R2
        working-directory: data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check boto3
          python ../scripts/r2_data.py sync --root . --map 'sharp-odds/ncaaf'='sharpodds-data/sharp-odds/ncaaf'
